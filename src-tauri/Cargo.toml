[package]
name = "ai-limitusage-watcher"
version = "0.1.0"
description = "Local usage visibility app for Codex and Claude Code"
authors = ["AI LimitUsage Watcher"]
edition = "2021"

[lib]
name = "ai_limitusage_watcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
chrono = { version = "0.4.39", features = ["serde"] }
open = "5.3.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.134"
tauri = { version = "2.2.5", features = [] }
thiserror = "2.0.9"

[dev-dependencies]
tempfile = "3.14.0"
