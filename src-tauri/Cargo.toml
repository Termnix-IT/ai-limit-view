[package]
name = "ai-limitusage-watcher"
version = "0.1.7"
description = "Local usage visibility app for Codex and Claude Code"
authors = ["AI LimitUsage Watcher"]
edition = "2021"

[lib]
name = "ai_limitusage_watcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
chrono = "0.4.39"
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.134"
tauri = { version = "2.2.5", features = [] }
tokio = { version = "1.52.1", features = ["io-util", "process", "time"] }
process-wrap = { version = "=10.0.0", default-features = false, features = ["tokio1", "creation-flags", "job-object", "kill-on-drop"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.14.0"
